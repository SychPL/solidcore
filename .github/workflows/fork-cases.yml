# Fork-only: runs the SolidCraft cases of the open case PRs on GitHub's runners.
name: fork cases
on:
  push:
    branches: [fork-ci-cases]
  workflow_dispatch:
jobs:
  cases:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: cases/solidcraft-6386
            glob: "6386-*"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - run: cargo test -p difftest --lib solidcraft
      - run: cargo run -p difftest -- --solidcraft-cases '${{ matrix.glob }}' --no-report
