# Fork-only: runs the SolidCraft cases of the open case PRs on GitHub's runners.
name: fork cases
on:
  push:
    branches: [fork-ci-cases]
  workflow_dispatch:
jobs:
  cases:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: cases/solidcraft-10965
            glob: "10965-*"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - run: cargo test --profile goldens -p goldens --lib solidcraft
      - run: cargo run --profile goldens -p goldens -- --solidcraft-cases '${{ matrix.glob }}' --no-report
